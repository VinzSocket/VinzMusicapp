<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VinzMusic App</title>
<!-- Script Resmi Google Identity -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-darker: #020617;
    --nav-bg: rgba(30, 41, 59, 0.75);
    --glass-indicator: linear-gradient(135deg, rgba(56, 189, 248, 0.4) 0%, rgba(129, 140, 248, 0.2) 100%);
    --text-active: #ffffff;
    --text-inactive: #64748b;
    --primary: #38bdf8;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

  body { margin: 0; height: 100vh; background-color: var(--bg-darker); overflow: hidden; color: #fff; }

  /* --- VIEW CONTROLLER --- */
  #authView, #appView { width: 100%; height: 100%; position: absolute; inset: 0; }
  #appView { display: none; background: radial-gradient(circle at top right, #1e293b, var(--bg-darker)); flex-direction: column; }

  /* --- LOGIN SCREEN (Adaptasi dari Vinz Music Login) --- */
  #authView { display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #121212, #000); overflow: hidden; }
  .login-orb { position: absolute; width: 350px; height: 350px; border-radius: 50%; filter: blur(90px); opacity: 0.45; animation: moveOrb 15s infinite alternate ease-in-out; }
  .login-orb:nth-child(1) { background: #00eaff; left: 15%; top: 20%; animation-delay: 0s; }
  .login-orb:nth-child(2) { background: #8b5cf6; left: 50%; top: 30%; animation-delay: -5s; }
  .login-orb:nth-child(3) { background: #ff2d75; left: 35%; top: 60%; animation-delay: -10s; }
  @keyframes moveOrb { 100% { transform: translate(-160px, -30px) scale(0.9); } }

  .glass-panel {
    position: relative; width: 340px; padding: 40px 30px; display: flex; flex-direction: column; align-items: center;
    background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 15px 40px rgba(0,0,0,0.6); z-index: 10;
  }
  .glass-panel h2 { margin: 0 0 25px 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  
  /* --- APP SCREENS --- */
  .content { flex: 1; position: relative; overflow: hidden; }
  .screen { position: absolute; inset: 0; padding: 30px 20px 180px 20px; opacity: 0; visibility: hidden; overflow-y: auto; transition: 0.3s ease; display: flex; flex-direction: column; }
  .screen.active { opacity: 1; visibility: visible; }
  
  .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  /* --- UI LIST LAGU (Universal) --- */
  .song-list { display: flex; flex-direction: column; gap: 12px; }
  .song-card { display: flex; align-items: center; gap: 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px; border-radius: 18px; backdrop-filter: blur(10px); }
  .song-card img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; }
  .song-info { flex: 1; overflow: hidden; }
  .song-info h3 { margin: 0 0 4px 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-info p { margin: 0; font-size: 12px; color: var(--text-inactive); }
  .play-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  /* --- SEARCH BOX --- */
  .search-box { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 20px; border: 1px solid var(--glass-border); }
  .search-box input { flex: 1; padding: 12px; background: transparent; border: none; color: #fff; outline: none; }
  .search-box button { padding: 0 20px; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--primary); border-radius: 14px; cursor: pointer; }

  /* --- AKUN SCREEN --- */
  .profile-card { text-align: center; padding: 30px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; }
  .profile-card img { width: 90px; height: 90px; border-radius: 50%; margin-bottom: 15px; border: 3px solid var(--primary); }
  .profile-card h3 { margin: 0 0 5px 0; font-size: 20px; }
  .profile-card p { margin: 0; color: var(--text-inactive); font-size: 14px; }
  .btn-logout { width: 100%; padding: 15px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; border-radius: 15px; font-weight: 600; cursor: pointer; }

  /* --- MINI PLAYER --- */
  .mini-player {
    position: absolute; bottom: -100px; left: 15px; right: 15px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 18px; display: flex; align-items: center; padding: 8px 12px; gap: 12px;
    transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 50; cursor: pointer;
  }
  .mini-player.active { bottom: 100px; }
  .mp-cover { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
  .mp-info { flex: 1; overflow: hidden; }
  .mp-info h4 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-info p { margin: 2px 0 0 0; font-size: 12px; color: var(--text-inactive); }
  .mp-controls button { background: transparent; border: none; color: #fff; cursor: pointer; padding: 5px; }

  /* --- FULL SCREEN PLAYER (Tampilan ala Spotify) --- */
  .full-player {
    position: fixed; inset: 0; background: linear-gradient(180deg, #1e293b 0%, #020617 100%);
    z-index: 200; display: flex; flex-direction: column; padding: 30px 25px;
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .full-player.active { transform: translateY(0); }
  
  .fp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .fp-header button { background: transparent; border: none; color: #fff; cursor: pointer; padding: 5px; }
  .fp-header p { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--text-inactive); text-transform: uppercase; }
  
  .fp-cover-container { width: 100%; aspect-ratio: 1/1; margin-bottom: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; }
  .fp-cover-container img { width: 100%; height: 100%; object-fit: cover; }
  
  .fp-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .fp-meta-text { flex: 1; overflow: hidden; }
  .fp-meta-text h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-meta-text p { margin: 0; font-size: 15px; color: var(--text-inactive); }
  .btn-love { background: transparent; border: none; color: #fff; cursor: pointer; transition: 0.2s; }
  .btn-love.active svg { fill: #1db954; stroke: #1db954; } /* Warna Hijau ala Spotify */

  /* Timeline */
  .fp-timeline { margin-bottom: 25px; }
  .progress-area { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
  .progress-bar { height: 100%; width: 0%; background: #fff; border-radius: 2px; position: relative; }
  .progress-bar::after { content: ""; position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; opacity: 0; transition: 0.2s; }
  .progress-area:hover .progress-bar::after { opacity: 1; }
  .time-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-inactive); margin-top: 8px; font-weight: 500; }

  /* Main Controls */
  .fp-controls { display: flex; justify-content: space-between; align-items: center; }
  .fp-controls button { background: transparent; border: none; color: #fff; cursor: pointer; }
  .btn-main-play { width: 65px; height: 65px; background: #fff !important; color: #000 !important; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
  .btn-main-play:active { transform: scale(0.9); }

  /* --- BOTTOM NAVIGATION BAR --- */
  .bottom-nav { position: absolute; bottom: 20px; left: 15px; right: 15px; height: 70px; background: var(--nav-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; z-index: 100; }
  .indicator { position: absolute; left: 0; top: 10px; height: 50px; background: var(--glass-indicator); border-radius: 20px; transition: transform 0.5s cubic-bezier(0.5, 1.2, 0.3, 1.1), width 0.4s ease; z-index: 0; }
  .nav-item { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; cursor: pointer; color: var(--text-inactive); transition: 0.3s; }
  .nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; transition: 0.4s; }
  .nav-item span { font-size: 0.7rem; font-weight: 600; opacity: 0; transform: translateY(15px); transition: 0.4s; position: absolute; bottom: 8px; }
  .nav-item.active { color: var(--text-active); }
  .nav-item.active svg { transform: translateY(-8px); }
  .nav-item.active span { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- WADAH LOGIN -->
<div id="authView">
  <div class="login-orb"></div><div class="login-orb"></div><div class="login-orb"></div>
  <div class="glass-panel">
    <h2>Vinz Music</h2>
    <p style="color: #a1a1aa; font-size: 13px; text-align: center; margin-top: -10px; margin-bottom: 25px;">Masuk untuk menyimpan koleksi musikmu</p>
    
    <!-- Tombol Google Otomatis (GSI) -->
    <div id="googleBtnContainer"></div>
  </div>
</div>

<!-- WADAH APLIKASI UTAMA -->
<div id="appView">
  <!-- Audio Core -->
  <audio id="realAudio" preload="auto"></audio>

  <div class="content">
    
    <!-- DASHBOARD (Sering Diputar) -->
    <div id="screen-Dashboard" class="screen active">
      <div class="section-title">Baru Diputar</div>
      <div class="song-list" id="historyList">
        <p style="color:#64748b; font-size: 14px;">Belum ada riwayat lagu.</p>
      </div>
    </div>

    <!-- PENCARIAN -->
    <div id="screen-Pencarian" class="screen">
      <div class="section-title">Cari Musik</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Judul lagu / Artis..." onkeypress="handleEnter(event)">
        <button onclick="searchSong()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
      </div>
      <div class="song-list" id="resultsList"></div>
    </div>

    <!-- KOLEKSI (Disimpan) -->
    <div id="screen-Koleksi" class="screen">
      <div class="section-title">Koleksi Tersimpan</div>
      <div class="song-list" id="collectionList">
        <p style="color:#64748b; font-size: 14px;">Kamu belum menyimpan lagu apapun.</p>
      </div>
    </div>

    <!-- AKUN -->
    <div id="screen-Akun" class="screen" style="align-items: center; padding-top: 50px;">
      <div class="profile-card">
        <img id="userPicture" src="https://via.placeholder.com/90" alt="Profile">
        <h3 id="userName">Nama User</h3>
        <p id="userEmail">user@email.com</p>
      </div>
      <button class="btn-logout" onclick="logoutGoogle()">Keluar Akun</button>
    </div>

  </div>

  <!-- MINI PLAYER (Bawah) -->
  <div class="mini-player" id="miniPlayer" onclick="openFullPlayer(event)">
    <img id="mpCover" class="mp-cover" src="https://via.placeholder.com/42" alt="Cover">
    <div class="mp-info">
      <h4 id="mpTitle">Memuat lagu...</h4>
      <p id="mpArtist">Mohon tunggu</p>
    </div>
    <div class="mp-controls">
      <button onclick="togglePlayPause(event)" id="mpPlayPauseBtn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </button>
    </div>
  </div>

  <!-- FULL SCREEN PLAYER (Melayang Ke Atas) -->
  <div class="full-player" id="fullPlayer">
    <!-- Header: Tombol Turun & Keterangan -->
    <div class="fp-header">
      <button onclick="closeFullPlayer()">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <p>Memainkan dari VinzMusic</p>
      <button style="opacity: 0;"><svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="1"></circle></svg></button> <!-- Spacer -->
    </div>
    
    <!-- Cover -->
    <div class="fp-cover-container">
      <img id="fpCover" src="https://via.placeholder.com/400" alt="Cover Besar">
    </div>
    
    <!-- Meta Data & Tombol Love -->
    <div class="fp-meta">
      <div class="fp-meta-text">
        <h2 id="fpTitle">Judul Lagu</h2>
        <p id="fpArtist">Nama Artis</p>
      </div>
      <button class="btn-love" id="btnLove" onclick="toggleCollection()">
        <!-- SVG Hati -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      </button>
    </div>
    
    <!-- Progress Bar -->
    <div class="fp-timeline">
      <div class="progress-area" id="progressArea" onclick="seekAudio(event)">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="durationTime">--:--</span>
      </div>
    </div>
    
    <!-- Main Controls -->
    <div class="fp-controls">
      <button><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
      <button onclick="skipAudio(-10)"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"></path></svg></button>
      
      <button class="btn-main-play" id="fpPlayPauseBtn" onclick="togglePlayPause()">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      
      <button onclick="skipAudio(10)"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"></path></svg></button>
      <button><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
    </div>
  </div>

  <!-- NAVIGASI BAWAH (Menu Dasar) -->
  <div class="bottom-nav">
    <div class="indicator"></div>
    <div class="nav-item active" data-title="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" data-title="Pencarian">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Cari</span>
    </div>
    <div class="nav-item" data-title="Koleksi">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      <span>Koleksi</span>
    </div>
    <div class="nav-item" data-title="Akun">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Akun</span>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // 1. SISTEM LOGIN GOOGLE IDENTITY
  // ==========================================
  const GOOGLE_CLIENT_ID = "606659995825-bdmkmg51k222mbr6b6dtie92ahbg1hpt.apps.googleusercontent.com"; //[span_2](start_span)[span_2](end_span)
  let currentUser = null;

  window.onload = function () {
    // Cek apakah user sudah login sebelumnya via localStorage
    const savedUser = localStorage.getItem('vinz_user');
    if(savedUser) {
      currentUser = JSON.parse(savedUser);
      masukKeApp();
    } else {
      // Inisialisasi Tombol Login Google
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleBtnContainer"),
        { theme: "outline", size: "large", shape: "pill", width: 280 }
      );
    }
  }

  function handleCredentialResponse(response) {
    // Decode JWT Token dari Google
    const responsePayload = decodeJwtResponse(response.credential);
    currentUser = {
      name: responsePayload.name,
      email: responsePayload.email,
      picture: responsePayload.picture
    };
    // Simpan sesi ke memori lokal
    localStorage.setItem('vinz_user', JSON.stringify(currentUser));
    masukKeApp();
  }

  function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }

  function masukKeApp() {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('appView').style.display = 'flex';
    
    // Isi data ke Menu Akun
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userEmail').innerText = currentUser.email;
    document.getElementById('userPicture').src = currentUser.picture;

    // Render data lokal
    renderHistory();
    renderCollection();
    
    // Setup Navigasi
    setTimeout(() => { moveIndicator(document.querySelector('.nav-item.active')); }, 100);
  }

  function logoutGoogle() {
    localStorage.removeItem('vinz_user');
    window.location.reload(); // Refresh total layar
  }

  // ==========================================
  // 2. NAVIGASI LAYAR BAWAH
  // ==========================================
  const navItems = document.querySelectorAll('.nav-item');
  const indicator = document.querySelector('.indicator');

  function moveIndicator(item) {
    const itemRect = item.getBoundingClientRect();
    const navRect = item.parentElement.getBoundingClientRect();
    const indicatorWidth = 72; 
    const itemCenter = itemRect.left - navRect.left + (itemRect.width / 2);
    indicator.style.width = `${indicatorWidth}px`;
    indicator.style.transform = `translateX(${itemCenter - (indicatorWidth / 2)}px)`;
  }

  navItems.forEach((item) => {
    item.addEventListener('click', () => {
      navItems.forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');
      moveIndicator(item);
      
      const targetScreen = item.getAttribute('data-title');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + targetScreen).classList.add('active');
      
      if(targetScreen === 'Dashboard') renderHistory();
      if(targetScreen === 'Koleksi') renderCollection();
    });
  });

  // ==========================================
  // 3. DATABASE LOKAL (HISTORY & COLLECTION)
  // ==========================================
  let playHistory = JSON.parse(localStorage.getItem('vinz_history')) || [];
  let savedCollection = JSON.parse(localStorage.getItem('vinz_collection')) || [];
  let currentActiveSong = null;

  function saveToHistory(songObj) {
    // Hapus duplikat kalau lagu sudah ada, pindahkan ke urutan teratas
    playHistory = playHistory.filter(s => s.url !== songObj.url);
    playHistory.unshift(songObj);
    if(playHistory.length > 20) playHistory.pop(); // Max 20 riwayat
    localStorage.setItem('vinz_history', JSON.stringify(playHistory));
  }

  function toggleCollection() {
    if(!currentActiveSong) return;
    const isSaved = savedCollection.find(s => s.url === currentActiveSong.url);
    
    if(isSaved) {
      savedCollection = savedCollection.filter(s => s.url !== currentActiveSong.url);
      document.getElementById('btnLove').classList.remove('active');
    } else {
      savedCollection.unshift(currentActiveSong);
      document.getElementById('btnLove').classList.add('active');
    }
    localStorage.setItem('vinz_collection', JSON.stringify(savedCollection));
    renderCollection();
  }

  function renderHistory() {
    const container = document.getElementById('historyList');
    if(playHistory.length === 0) return container.innerHTML = `<p style="color:#64748b; font-size:14px;">Belum ada riwayat.</p>`;
    container.innerHTML = playHistory.map(song => generateCardHTML(song)).join('');
  }

  function renderCollection() {
    const container = document.getElementById('collectionList');
    if(savedCollection.length === 0) return container.innerHTML = `<p style="color:#64748b; font-size:14px;">Koleksi kosong.</p>`;
    container.innerHTML = savedCollection.map(song => generateCardHTML(song)).join('');
  }

  function generateCardHTML(song) {
    // Escaping petik agar onclick tidak error
    const t = song.title.replace(/'/g, "\\'");
    const a = song.artist.replace(/'/g, "\\'");
    return `
      <div class="song-card" onclick="fetchAudio('${song.url}', '${t}', '${a}', '${song.cover}')">
        <img src="${song.cover}" alt="Cover">
        <div class="song-info">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
        </div>
        <button class="play-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
      </div>
    `;
  }

  // ==========================================
  // 4. SISTEM PENCARIAN & AUDIO (NEOXR)
  // ==========================================
  const APIKEY = "VinzKeyNeoxr0021";
  const audio = document.getElementById("realAudio");

  const iconPlay = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>`;
  const iconPause = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`;
  const iconLoading = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" class="spinner" style="animation: spin 1s linear infinite"><circle cx="12" cy="12" r="10" stroke-dasharray="30"></circle></svg>`;

  function handleEnter(event) { if (event.key === "Enter") searchSong(); }

  async function searchSong() {
    const query = document.getElementById("searchInput").value.trim();
    const resDiv = document.getElementById("resultsList");
    if(!query) return;

    resDiv.innerHTML = `<p style="color:#64748b; text-align:center;">Mencari lagu...</p>`;
    try {
      const response = await fetch(`https://api.neoxr.eu/api/spotify-search?q=${encodeURIComponent(query)}&apikey=${APIKEY}`);
      const result = await response.json();
      
      if(result.status && result.data) {
        resDiv.innerHTML = result.data.map(s => {
          return generateCardHTML({ title: s.title, artist: s.artist||s.author, cover: s.thumbnail||s.image, url: s.url });
        }).join('');
      } else {
        resDiv.innerHTML = `<p style="color:#ef4444; text-align:center;">Lagu tidak ditemukan.</p>`;
      }
    } catch(err) {
      resDiv.innerHTML = `<p style="color:#ef4444; text-align:center;">Gagal jaringan.</p>`;
    }
  }

  async function fetchAudio(spotifyUrl, title, artist, cover) {
    // Siapkan object lagu saat ini
    currentActiveSong = { title, artist, cover, url: spotifyUrl };
    saveToHistory(currentActiveSong);
    
    // Update UI Status (Heart icon)
    const isSaved = savedCollection.find(s => s.url === spotifyUrl);
    document.getElementById('btnLove').className = isSaved ? 'btn-love active' : 'btn-love';

    // Munculkan Mini Player
    document.getElementById('miniPlayer').classList.add('active');
    
    // Sinkronisasi teks di Mini dan Full Player
    document.getElementById('mpTitle').innerText = title;
    document.getElementById('mpArtist').innerText = "Memuat...";
    document.getElementById('mpCover').src = cover;
    
    document.getElementById('fpTitle').innerText = title;
    document.getElementById('fpArtist').innerText = "Mengekstrak MP3...";
    document.getElementById('fpCover').src = cover;

    audio.src = "";
    document.getElementById('mpPlayPauseBtn').innerHTML = iconLoading;
    document.getElementById('fpPlayPauseBtn').innerHTML = iconLoading;

    try {
      const res = await fetch(`https://api.neoxr.eu/api/spotify?url=${encodeURIComponent(spotifyUrl)}&apikey=${APIKEY}`);
      const result = await res.json();

      if(result.status && result.data.url) {
        audio.src = result.data.url;
        document.getElementById('mpArtist').innerText = artist;
        document.getElementById('fpArtist').innerText = artist;
        audio.play();
      } else {
        document.getElementById('mpArtist').innerText = "Gagal Limit API";
        document.getElementById('fpArtist').innerText = "Error: Limit Habis";
        updatePlayIcons(iconPlay);
      }
    } catch(err) {
      document.getElementById('mpArtist').innerText = "Network Error";
      updatePlayIcons(iconPlay);
    }
  }
  // ==========================================
  // 5. KONTROL AUDIO & ANIMASI FULL SCREEN
  // ==========================================
  function openFullPlayer(e) {
    // Cegah klik tombol play di mini player agar tidak ikut membuka layar
    if(e.target.closest('#mpPlayPauseBtn')) return; 
    document.getElementById('fullPlayer').classList.add('active');
  }
  
  function closeFullPlayer() {
    document.getElementById('fullPlayer').classList.remove('active');
  }

  function togglePlayPause(e) {
    if(e) e.stopPropagation();
    if(!audio.src) return;
    if (audio.paused) audio.play();
    else audio.pause();
  }

  function skipAudio(sec) { audio.currentTime += sec; }

  function updatePlayIcons(svgString) {
    document.getElementById('mpPlayPauseBtn').innerHTML = svgString;
    document.getElementById('fpPlayPauseBtn').innerHTML = svgString;
  }

  audio.addEventListener("play", () => updatePlayIcons(iconPause));
  audio.addEventListener("pause", () => updatePlayIcons(iconPlay));

  // Update Progress Bar
  const pBar = document.getElementById("progressBar");
  const tCur = document.getElementById("currentTime");
  const tDur = document.getElementById("durationTime");

  audio.addEventListener("timeupdate", () => {
    if(audio.duration) {
      const pct = (audio.currentTime / audio.duration) * 100;
      pBar.style.width = pct + "%";
      tCur.innerText = formatTime(audio.currentTime);
      tDur.innerText = formatTime(audio.duration);
    }
  });

  // Seek bar manual
  function seekAudio(e) {
    const area = document.getElementById("progressArea");
    const clickX = e.offsetX;
    const width = area.clientWidth;
    audio.currentTime = (clickX / width) * audio.duration;
  }

  function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }
</script>

</body>
</html>
